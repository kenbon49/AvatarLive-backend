version: "3.8"

services:
  musetalk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musetalk_prod
    image: musetalk:prod
    expose:
      - "8083"
    volumes:
      - ./models:/app/models:ro
      - ./core_data:/app/core_data
      - ./cache:/root/.cache
    environment:
      PYTHONUNBUFFERED: "1"
      CUDA_VISIBLE_DEVICES: "0"
      MUSETALK_FPS: ${MUSETALK_FPS:-25}
      MUSETALK_BATCH_SIZE: ${MUSETALK_BATCH_SIZE:-4}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/readiness | grep -q '\"status\":\"ready\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
