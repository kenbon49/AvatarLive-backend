name: avatarlive-backend

services:
  musetalk:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        PYTORCH_IMAGE: ${PYTORCH_IMAGE:-pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel}
    image: avatarlive-backend-musetalk:local
    ports:
      - "8083:8083"
    volumes:
      - ./models:/app/models:ro
      - ./cache:/app/cache
      - ${AVATAR_ASSET_HOST_DIR:-../AvatarLive/runtime/avatar-assets}:/app/data/custom
    shm_size: "8gb"
    environment:
      PYTHONUNBUFFERED: "1"
      CUDA_VISIBLE_DEVICES: "0"
      MUSETALK_DEVICE: cuda:0
      # Float32 inference on this RTX 5090 is configured for real-time playback.
      MUSETALK_FPS: "${SERVER_TOTAL_MUSETALK_FPS:-15}"
      MUSETALK_BATCH_SIZE: "${SERVER_TOTAL_MUSETALK_BATCH_SIZE:-8}"
      MUSETALK_MAX_FRAME_HEIGHT: "${SERVER_TOTAL_MUSETALK_MAX_FRAME_HEIGHT:-720}"
      MUSETALK_JPEG_QUALITY: "${SERVER_TOTAL_MUSETALK_JPEG_QUALITY:-92}"
      MUSETALK_CUSTOM_AVATAR_DIR: /app/data/custom
      AVATAR_REGISTRY_KEY: ${AVATAR_REGISTRY_KEY:-}
    command: python3 -u -m accelerated.server --host 0.0.0.0 --port 8083
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/readiness | grep -q '\"status\":\"ready\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  tts:
    build:
      context: .
      dockerfile: OpenVoice/Dockerfile
      args:
        PYTORCH_IMAGE: ${PYTORCH_IMAGE:-pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel}
    image: avatarlive-backend-tts:local
    ports:
      - "8084:8084"
    volumes:
      - ./OpenVoice:/app/OpenVoice
      - ./data/input/audio:/app/data/input/audio:ro
    environment:
      PYTHONUNBUFFERED: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: "0"
      TTS_SERVICE: ${TTS_SERVICE:-melotts}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-default}
      MELOTTS_DEVICE: ${MELOTTS_DEVICE:-cuda:0}
      OPENVOICE_DEVICE: cuda:0
      OPENVOICE_DEFAULT_VOICE: default
      OPENVOICE_DEFAULT_REFERENCE: /app/data/input/audio/yongen.wav
    command: python3 start_tts.py --host 0.0.0.0 --port 8084
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/health | grep -q '\"status\":\"ok\"'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  server-total:
    build:
      context: .
      dockerfile: server_total/Dockerfile
      args:
        REGISTRY: ${REGISTRY:-}
    image: avatarlive-backend-server-total:local
    ports:
      - "8085:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      LITELLM_BASE_URL: ${LITELLM_LLM_BASE_URL:-http://ollama:11434/v1}
      LITELLM_API_KEY: ${LITELLM_LLM_API_KEY:-ollama}
      # The frontend value is a UI model id; server_total calls LiteLLM directly.
      LITELLM_MODEL: ${SERVER_TOTAL_LITELLM_MODEL:-gemma3:12b}
      LITELLM_TEMPERATURE: ${SERVER_TOTAL_LITELLM_TEMPERATURE:-0.3}
      TTS_SERVICE: ${TTS_SERVICE:-melotts}
      TTS_URL: http://tts:8084
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-default}
      MUSETALK_WS_URL: ws://musetalk:8083/v1/stream
      MUSETALK_HTTP_URL: http://musetalk:8083
      PIPELINE_REQUEST_TIMEOUT: "300"
      PIPELINE_FIRST_UNIT_MIN_CHARS: "1"
      PIPELINE_TARGET_UNIT_CHARS: "1"
      PIPELINE_COALESCE_HARD_DELIMITERS: "0"
    depends_on:
      musetalk:
        condition: service_healthy
      tts:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-models:
    external: true
    name: ${OLLAMA_VOLUME_NAME:-ollama}
