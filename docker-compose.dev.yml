# 开发环境配置 - 支持代码热更新
services:
  # CosyVoice 提供预置音色、Whisper 转写和零样本音色克隆。
  cosyvoice-dev:
    build:
      context: ./CosyVoice
      dockerfile: Dockerfile

    container_name: cosyvoice_dev
    image: cosyvoice:dev
    # This is a project-local image built from the pre-pulled PyTorch base.
    pull_policy: build

    ports:
      - "8084:8084"

    volumes:
      - ./CosyVoice:/app
      - ./models/whisper:/models/whisper:ro
      - ./.tmp-whisper-tokenizer:/models/whisper-tokenizer:ro

    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_OFFLINE=1
      - CUDA_VISIBLE_DEVICES=0
      - WHISPER_MODEL_DIR=/models/whisper
      - WHISPER_TOKENIZER_DIR=/models/whisper-tokenizer
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      # All ModelScope assets must come from this project-local cache.
      - MODELSCOPE_CACHE=/app/local_models/modelscope
      - MODELSCOPE_OFFLINE=1
      - WETEXT_MODEL_DIR=/app/local_models/modelscope/hub/pengzhendong/wetext

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Keep the native PyTorch LLM path; TensorRT accelerates Flow decoding.
    command: python server_v2.py --host 0.0.0.0 --port 8084 --load-trt
    restart: "no"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/health | grep -q '\"status\":\"ok\"'"]
      interval: 20s
      timeout: 5s
      retries: 10
      # A first-time TensorRT plan build can take many minutes. Failures are
      # still detected immediately if the process exits during this window.
      start_period: ${COSYVOICE_HEALTH_START_PERIOD:-45m}

    networks:
      - musetalk_network

  # 轻量网关负责 LLM -> CosyVoice -> MuseTalk，不加载推理模型。
  musetalk-dev:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: musetalk_dev
    image: musetalk:latest

    ports:
      - "8083:8083"
      - "5678:5678"  # Python debugger 端口

    # 开发模式：挂载所有源码，支持热更新
    volumes:
      - ./models:/app/models:ro
      - ./core_data:/app/core_data
      - ./cache:/root/.cache  # 挂载torch/huggingface缓存，避免重复下载
      - .:/app  # 挂载整个项目目录

    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      # One second of audio maps to exactly one 12-frame GPU batch.
      - MUSETALK_FPS=${MUSETALK_FPS:-12}
      - MUSETALK_BATCH_SIZE=${MUSETALK_BATCH_SIZE:-12}
      - DEBUG=1  # 开发模式标志

    # 开发模式使用命令行启动，方便调试
    command: python3 -u -m accelerated.server --host 0.0.0.0 --port 8083

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # 开发模式不自动重启，方便调试
    restart: "no"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/readiness | grep -q '\"status\":\"ready\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

    networks:
      - musetalk_network

  server-total-dev:
    build:
      context: .
      dockerfile: server_total/Dockerfile

    container_name: server_total_dev
    image: musetalk-server-total:dev

    ports:
      - "8080:8080"

    volumes:
      - ./server_total:/app/server_total
      - ./llm_inference:/app/llm_inference

    # 直接复用已通过独立测试的 LiteLLM 配置。
    env_file:
      - ./llm_inference/.env

    environment:
      - PYTHONUNBUFFERED=1
      - COSYVOICE_URL=http://cosyvoice-dev:8084
      - COSYVOICE_DEFAULT_VOICE=${COSYVOICE_DEFAULT_VOICE:-default_female}
      - MUSETALK_WS_URL=ws://musetalk-dev:8083/v1/stream
      - PIPELINE_REQUEST_TIMEOUT=${PIPELINE_REQUEST_TIMEOUT:-300}
      - PIPELINE_FIRST_UNIT_MIN_CHARS=${PIPELINE_FIRST_UNIT_MIN_CHARS:-40}
      - PIPELINE_TARGET_UNIT_CHARS=${PIPELINE_TARGET_UNIT_CHARS:-60}
      - PIPELINE_COALESCE_HARD_DELIMITERS=${PIPELINE_COALESCE_HARD_DELIMITERS:-1}
      - PIPELINE_AUDIO_QUEUE_SIZE=${PIPELINE_AUDIO_QUEUE_SIZE:-12}
      - PIPELINE_TTS_CHUNK_SECONDS=${PIPELINE_TTS_CHUNK_SECONDS:-1.0}
      - PIPELINE_PLAYBACK_BUFFER_SECONDS=${PIPELINE_PLAYBACK_BUFFER_SECONDS:-6.0}

    command: uvicorn server_total.app:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      musetalk-dev:
        condition: service_healthy
      cosyvoice-dev:
        condition: service_healthy
    restart: "no"

    networks:
      - musetalk_network

networks:
  musetalk_network:
    driver: bridge
