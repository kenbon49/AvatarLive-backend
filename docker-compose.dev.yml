# 开发环境配置 - 支持代码热更新
services:
  # TTS 常驻服务；默认直接用 MeloTTS，可通过 TTS_SERVICE=openvoice 回切。
  tts-dev:
    build:
      context: .
      dockerfile: OpenVoice/Dockerfile

    container_name: tts_dev
    image: avatarlive-tts:dev

    ports:
      - "8084:8084"

    volumes:
      - ./OpenVoice:/app/OpenVoice
      - ./data/input/audio:/app/data/input/audio:ro

    environment:
      - PYTHONUNBUFFERED=1
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - CUDA_VISIBLE_DEVICES=0
      - TTS_SERVICE=${TTS_SERVICE:-melotts}
      - TTS_DEFAULT_VOICE=${TTS_DEFAULT_VOICE:-default}
      - MELOTTS_DEVICE=${MELOTTS_DEVICE:-cuda:0}
      - OPENVOICE_DEVICE=${OPENVOICE_DEVICE:-cuda:0}
      - OPENVOICE_DEFAULT_VOICE=${OPENVOICE_DEFAULT_VOICE:-default}
      - OPENVOICE_DEFAULT_REFERENCE=/app/data/input/audio/yongen.wav

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    command: python3 start_tts.py --host 0.0.0.0 --port 8084
    restart: "no"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/health | grep -q '\"status\":\"ok\"'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: ${OPENVOICE_HEALTH_START_PERIOD:-10m}

    networks:
      - musetalk_network

  # 轻量网关负责 LLM -> TTS -> MuseTalk，不加载推理模型。
  musetalk-dev:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: musetalk_dev
    image: musetalk:latest

    ports:
      - "8083:8083"
      - "5678:5678"  # Python debugger 端口

    # 开发模式：挂载所有源码，支持热更新
    volumes:
      - ./models:/app/models:ro
      - ./core_data:/app/core_data
      - ./cache:/root/.cache  # 挂载torch/huggingface缓存，避免重复下载
      - .:/app  # 挂载整个项目目录

    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      # One second of audio maps to exactly one 12-frame GPU batch.
      - MUSETALK_FPS=${MUSETALK_FPS:-10}
      - MUSETALK_BATCH_SIZE=${MUSETALK_BATCH_SIZE:-10}
      - MUSETALK_ALLOW_TF32=${MUSETALK_ALLOW_TF32:-1}
      - DEBUG=1  # 开发模式标志

    # 开发模式使用命令行启动，方便调试
    command: python3 -u -m accelerated.server --host 0.0.0.0 --port 8083

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # 开发模式不自动重启，方便调试
    restart: "no"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/readiness | grep -q '\"status\":\"ready\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

    networks:
      - musetalk_network

  server-total-dev:
    build:
      context: .
      dockerfile: server_total/Dockerfile
      args:
        REGISTRY: ${REGISTRY:-}

    container_name: server_total_dev
    image: musetalk-server-total:dev

    ports:
      - "8080:8080"

    volumes:
      - ./server_total:/app/server_total
      - ./llm_inference:/app/llm_inference

    # 直接复用已通过独立测试的 LiteLLM 配置。
    env_file:
      - ./llm_inference/.env

    environment:
      - PYTHONUNBUFFERED=1
      - TTS_SERVICE=${TTS_SERVICE:-melotts}
      - TTS_URL=http://tts-dev:8084
      - TTS_DEFAULT_VOICE=${TTS_DEFAULT_VOICE:-default}
      - MUSETALK_WS_URL=ws://musetalk-dev:8083/v1/stream
      - PIPELINE_REQUEST_TIMEOUT=${PIPELINE_REQUEST_TIMEOUT:-300}
      - PIPELINE_FIRST_UNIT_MIN_CHARS=${PIPELINE_FIRST_UNIT_MIN_CHARS:-1}
      - PIPELINE_TARGET_UNIT_CHARS=${PIPELINE_TARGET_UNIT_CHARS:-1}
      - PIPELINE_COALESCE_HARD_DELIMITERS=${PIPELINE_COALESCE_HARD_DELIMITERS:-0}
      - PIPELINE_AUDIO_QUEUE_SIZE=${PIPELINE_AUDIO_QUEUE_SIZE:-12}
      - PIPELINE_TTS_CHUNK_SECONDS=${PIPELINE_TTS_CHUNK_SECONDS:-0.5}
      - PIPELINE_TTS_STEADY_CHUNK_SECONDS=${PIPELINE_TTS_STEADY_CHUNK_SECONDS:-1.0}
      - PIPELINE_TTS_MIN_TAIL_SECONDS=${PIPELINE_TTS_MIN_TAIL_SECONDS:-0.25}
      - PIPELINE_PLAYBACK_BUFFER_SECONDS=${PIPELINE_PLAYBACK_BUFFER_SECONDS:-1.5}

    command: uvicorn server_total.app:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      musetalk-dev:
        condition: service_healthy
      tts-dev:
        condition: service_healthy
    restart: "no"

    networks:
      - musetalk_network

networks:
  musetalk_network:
    driver: bridge
